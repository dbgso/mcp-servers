packages:
  - packages/*
  # Repository tooling. A workspace package so `pnpm -r test` covers it like
  # everything else; private, so it is never published.
  - scripts

# pnpm 11 refuses to install while a dependency's build script is neither
# approved nor declined. esbuild's puts its platform binary in place, and tsup
# runs on esbuild, so the publishable bundles depend on it.
allowBuilds:
  esbuild: true

catalog:
  '@duckdb/node-api': 1.5.2-r.1
  '@changesets/cli': 2.29.8
  '@modelcontextprotocol/sdk': 1.26.0
  '@types/cytoscape': 3.31.0
  '@types/cytoscape-dagre': 2.3.4
  '@types/node': 22.15.21
  '@vitest/coverage-v8': 4.0.18
  cytoscape: 3.34.2
  cytoscape-dagre: 4.0.1
  'node-notifier': 10.0.1
  oxlint: 1.63.0
  tsup: 8.5.0
  tsx: 4.19.4
  typescript: 5.8.3
  ulid: 2.3.0
  vitest: 4.0.18
  zod: 3.25.76
  zod-to-json-schema: 3.25.1
