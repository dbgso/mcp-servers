name: Docker Release

on:
  push:
    tags:
      - '*-mcp-v*'  # Matches: python-diagrams-mcp-v1.0.0, foo-mcp-v2.1.0, etc.

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Extract package name (everything before -v followed by version)
          PACKAGE_NAME="${TAG%%-v[0-9]*}"
          # Extract version (everything after last -v)
          VERSION="${TAG##*-v}"

          {
            echo "tag=$TAG"
            echo "package=$PACKAGE_NAME"
            echo "version=$VERSION"
            echo "image=${{ env.REGISTRY }}/${{ github.repository_owner }}/$PACKAGE_NAME"
          } >> "$GITHUB_OUTPUT"

          echo "Tag: $TAG"
          echo "Package: $PACKAGE_NAME"
          echo "Version: $VERSION"

      - name: Verify package exists
        run: |
          PACKAGE_PATH="./packages/${STEPS_PARSE_OUTPUTS_PACKAGE}"
          if [ ! -d "$PACKAGE_PATH" ]; then
            echo "Error: Package directory not found: $PACKAGE_PATH"
            exit 1
          fi
          if [ ! -f "$PACKAGE_PATH/Dockerfile" ]; then
            echo "Error: Dockerfile not found in $PACKAGE_PATH"
            exit 1
          fi
          echo "Package verified: $PACKAGE_PATH"
        env:
          STEPS_PARSE_OUTPUTS_PACKAGE: ${{ steps.parse.outputs.package }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A published version is immutable here the way it is on npm. Without this,
      # a re-tag -- or a tag created while reconciling versions with what is
      # already released -- rebuilds from whatever the source looks like now and
      # overwrites an image someone may already be running under that number.
      - name: Refuse to overwrite a published version
        run: |
          image="${STEPS_PARSE_OUTPUTS_IMAGE}"
          version="${STEPS_PARSE_OUTPUTS_VERSION}"
          if docker manifest inspect "${image}:${version}" >/dev/null 2>&1; then
            echo "::error::${image}:${version} is already published. Bump the version to release again."
            exit 1
          fi
          echo "${image}:${version} is not published yet; proceeding."
        env:
          STEPS_PARSE_OUTPUTS_IMAGE: ${{ steps.parse.outputs.image }}
          STEPS_PARSE_OUTPUTS_VERSION: ${{ steps.parse.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./packages/${{ steps.parse.outputs.package }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.parse.outputs.image }}:latest
            ${{ steps.parse.outputs.image }}:${{ steps.parse.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
