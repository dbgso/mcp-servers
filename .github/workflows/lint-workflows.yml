name: Lint Workflows

on:
  pull_request:
    paths:
      - '.github/**'

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `fail_level` matters more than it looks. The default lets reviewdog
      # annotate and still exit 0, so this job went green while carrying five
      # failure-level findings -- which is how the node20 deprecation sat on a
      # passing branch, and how reading "Lint Workflows success" led to the
      # conclusion that there was nothing to fix. A check that cannot go red
      # reports; it does not check.
      - uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-pr-check
          fail_level: error
