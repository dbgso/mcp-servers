name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm

      # Starts floci (waits for healthy) and exports AWS_* env for the emulator.
      - uses: ./.github/actions/floci

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # `-- --coverage` puts the flag after vitest's `--`, where it is read as a
      # test-name filter and silently dropped. Coverage has therefore never run
      # in CI, and the thresholds in every vitest.config.ts have never been
      # checked -- which is how a package came to sit 7 points under its own.
      - name: Test with coverage
        run: pnpm -r test --coverage

      # v7 rather than v5 for the same reason as the rest: v5 pins
      # `actions/github-script@v7.0.1` internally, which is node20, and the
      # runner reported it as the last one left. v6 is the release that bumped
      # it; v7 only changes which account holds the gpg key. Coverage upload
      # already tolerates its own failure below, so this is the cheapest of the
      # bumps to be wrong about.
      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
