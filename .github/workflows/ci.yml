name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm

      # Starts floci (waits for healthy) and exports AWS_* env for the emulator.
      - uses: ./.github/actions/floci

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # `-- --coverage` puts the flag after vitest's `--`, where it is read as a
      # test-name filter and silently dropped. Coverage has therefore never run
      # in CI, and the thresholds in every vitest.config.ts have never been
      # checked -- which is how a package came to sit 7 points under its own.
      - name: Test with coverage
        run: pnpm -r test --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
