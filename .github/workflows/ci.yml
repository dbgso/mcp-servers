name: CI

on:
  push:
    branches:
      - main
  pull_request:

# A new push supersedes the one before it, and 22 test jobs per run is enough
# that letting both sets finish is a way to sit behind the concurrency cap for no
# reason. `main` is excluded: those runs are the record of what was merged.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Read off the packages rather than listed here. A package added without a line
  # in a workflow is a package whose tests never run, with nothing going red to
  # say so. See scripts/ci-test-matrix.mjs.
  packages:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: echo "matrix=$(node scripts/ci-test-matrix.mjs)" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm lint

  # The whole repository still has to compile, which is not the same question as
  # whether each package's own tests pass: a package can be green on its own and
  # have broken the type of something downstream of it.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm build

  test:
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      # One package's failure is not a reason to stop learning about the others,
      # and the point of splitting was to get all the answers in one run.
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.packages.outputs.matrix) }}
    name: test (${{ matrix.package.name }})
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm

      # Only where the emulator is actually used. It is ten seconds, which is
      # nothing once -- and twenty-two times is the kind of cost that is only
      # obvious after somebody adds the second service.
      - if: matrix.package.floci
        uses: ./.github/actions/floci

      # `...` builds this package's dependencies too, and nothing else. A
      # separate build job whose artifact these downloaded would be a serial
      # stage in front of every one of them; this pays only for what the package
      # needs.
      - name: Build dependencies
        run: pnpm --filter ${{ matrix.package.name }}... build

      - name: Test with coverage
        run: pnpm --filter ${{ matrix.package.name }} test --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.package.name }}
          fail_ci_if_error: false
