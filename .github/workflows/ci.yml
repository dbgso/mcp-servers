name: CI

on:
  push:
    branches:
      - main
  pull_request:

# A new push supersedes the one before it, and 22 test jobs per run is enough
# that letting both sets finish is a way to sit behind the concurrency cap for no
# reason. `main` is excluded: those runs are the record of what was merged.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Read off the packages rather than listed here. A package added without a line
  # in a workflow is a package whose tests never run, with nothing going red to
  # say so. See scripts/ci-test-matrix.mjs.
  packages:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: echo "matrix=$(node scripts/ci-test-matrix.mjs)" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
      # `pnpm lint` is type-aware, and a workspace package's types come from its
      # built `dist/*.d.ts`. Unbuilt, every cross-package type is an error type
      # that acts as `any`: unbound-method stops seeing methods across packages,
      # and rules like require-array-sort-compare report what a build resolves.
      - run: pnpm build
      - run: pnpm lint
      # The smoke scripts and their kit run under `tsx`, which strips types
      # without checking them, so nothing else here would see a type error in
      # them before the db-smoke job tripped over it at run time.
      - name: Type-check the smoke scripts
        run: pnpm exec tsc -p tsconfig.scripts.json
      # Scoped by .jscpd.json to the smoke scripts, which grew a second copy of
      # everything once per engine before the shared kit existed.
      - name: Copy-paste check
        run: pnpm lint:duplication
      # A changeset is published verbatim inside the package's CHANGELOG.md, and
      # nobody reads a generated file before it ships. This is the one chance to
      # catch markdown that will say something else once prettier has resolved
      # it -- after the release there is a wrong version on npm.
      - name: Verify changeset markdown
        run: node scripts/verify-changeset-markdown.mjs

  # The whole repository still has to compile, which is not the same question as
  # whether each package's own tests pass: a package can be green on its own and
  # have broken the type of something downstream of it.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm build

  test:
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      # One package's failure is not a reason to stop learning about the others,
      # and the point of splitting was to get all the answers in one run.
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.packages.outputs.matrix) }}
    name: >-
      test (${{ matrix.package.name }}${{
        matrix.package.shards > 1 && format(' {0}/{1}', matrix.package.shard, matrix.package.shards) || ''
      }})
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm

      # Only where the emulator is actually used. It is ten seconds, which is
      # nothing once -- and twenty-two times is the kind of cost that is only
      # obvious after somebody adds the second service.
      - if: matrix.package.floci
        uses: ./.github/actions/floci

      # `...` builds this package's dependencies too, and nothing else. A
      # separate build job whose artifact these downloaded would be a serial
      # stage in front of every one of them; this pays only for what the package
      # needs.
      - name: Build dependencies
        run: pnpm --filter ${{ matrix.package.name }}... build

      # `--shard` splits by file, for the one package slow enough to be the whole
      # run's critical path. A package with coverage thresholds cannot be sharded
      # -- each shard would measure a subset and fail a threshold written for all
      # of it -- and the matrix generator refuses that combination rather than
      # letting CI discover it.
      - name: Test with coverage
        run: |
          pnpm --filter ${{ matrix.package.name }} test --coverage ${{
            matrix.package.shards > 1 && format('--shard={0}/{1}', matrix.package.shard, matrix.package.shards) || ''
          }}

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.package.name }}
          fail_ci_if_error: false

  # Separate job, not a step in `test`: it needs two database servers and an
  # SSH bastion, which no other job pays for. Runs in parallel, so it costs
  # wall-clock only if it is the slower of the two.
  #
  # The drivers come from the lockfile like everything else (the `pg` and
  # `mysql2` catalog entries), so a dependency update to either is exercised
  # here against a real engine rather than only against `vi.mock`.
  db-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm

      # Before the bastion starts: compose mounts the public key into it.
      - name: Generate the bastion keypair
        run: ./ci/db/gen-ssh-key.sh

      # `--wait` blocks on each service's healthcheck, so nothing here polls or
      # sleeps. Postgres answers on its unix socket while the seed is still
      # running, which is why its healthcheck goes over TCP.
      - name: Start Postgres, MySQL and the SSH bastion
        run: docker compose -f compose.yaml up -d --wait postgres mysql bastion

      # The smoke scripts import their own package's source directly, and every
      # other workspace package through its built entry (enforced by the
      # no-restricted-imports override in .oxlintrc.json), so the dependencies
      # have to be built.
      - name: Build
        run: pnpm build

      # So a run's log says which driver versions it actually proved, without
      # having to reconstruct them from the lockfile at that commit.
      - name: Driver versions under test
        run: pnpm -r list pg mysql2 --depth 0

      # Each asserts nothing about a particular schema: it introspects, picks a
      # table, probes a real value out of it, and runs every read operation
      # against what it found. The seed exists to give it something to find.
      - name: Postgres smoke test
        run: pnpm --filter mcp-shared-db-postgres smoke

      - name: MySQL smoke test
        run: pnpm --filter mcp-shared-db-mysql smoke

      # The read-only guarantee is a property of the session, so no unit test
      # can reach it: these issue a write on a guarded connection and require
      # the engine to refuse it with its read-only error code. Each probe is
      # first run unguarded and must succeed, so a probe that fails for some
      # other reason cannot pass. Both are harmless if the guard is missing
      # -- a temporary table that dies with the connection, and an UPDATE whose
      # WHERE clause matches nothing.
      - name: Read-only guarantee (Postgres)
        run: pnpm --filter db-read-mcp smoke:readonly:pg

      - name: Read-only guarantee (MySQL)
        run: pnpm --filter db-read-mcp smoke:readonly:mysql

      # Drives the real `ssh` binary against a real server. The URL names the
      # database by a hostname only the bastion can resolve, so a tunnel that
      # is not actually carrying the connection cannot pass by reaching the
      # database some other way.
      - name: SSH tunnel (Postgres through a bastion)
        run: pnpm --filter db-read-mcp smoke:tunnel

      # The unit tests for this run against rows the test wrote itself. A real
      # driver decides the shape of a row -- numerics arrive as strings, JSON
      # as objects -- and the policy has to hold for whatever comes back.
      - name: Field visibility policy (Postgres)
        run: pnpm --filter db-read-mcp smoke:visibility

      - name: Database logs on failure
        if: failure()
        run: docker compose -f compose.yaml logs --no-color --tail=100 postgres mysql bastion
