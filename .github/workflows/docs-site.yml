name: docs site

# docs/ja を Antora でサイトにして、private static site の mcp-servers サイトに deploy する
# (dbgso/cloud-foundation の docs-site.yml と同じ形。道具は docs/ ではなく docs-site/ にある。docs/ja/docs-site.adoc)。
# main は サイトのルート、PR は pr-preview/pr-<番号>/ に置き、PR を閉じたら消す (dbgso/private-static-site の docs/ja/deploy-workflow.adoc と同じ形)。
#
# deploy 先は repository variables で渡す (private-static-site の `terraform output private_static_site_deployments` の mcp-servers の値)。
#   PSS_DOCS_ROLE_ARN / PSS_DOCS_BUCKET / PSS_DOCS_URL
# 未設定のうち (terraform を apply する前) は build だけして、出来上がりを artifact に置く。

on:
  push:
    branches: [main]
    paths:
      - "docs/ja/**"
      - "docs-site/**"
      - ".github/workflows/docs-site.yml"
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - "docs/ja/**"
      - "docs-site/**"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

# main の deploy は途中で止めると半端な状態になるので cancel しない。プレビューは新しい push で置き換えてよい
concurrency:
  group: docs-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE_ROLE_ARN: ${{ vars.PSS_DOCS_ROLE_ARN }}
  SITE_BUCKET: ${{ vars.PSS_DOCS_BUCKET }}
  SITE_URL: ${{ vars.PSS_DOCS_URL }}
  PREVIEW_SUBDIR: pr-preview/pr-${{ github.event.pull_request.number }}

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      # PlantUML の書き方の決まり (シーケンス図の autonumber など)
      - name: Check PlantUML rules
        run: docs-site/check-plantuml-rules.sh

      - name: Build
        working-directory: docs-site
        run: |
          npm ci
          ./build.sh

      # 図は閲覧のときに Kroki の Lambda が描く。同じ版の image を立てて、全部の図が描けるかを確かめる
      - name: Check diagrams
        run: |
          docker build -t docs-kroki docs-site/kroki
          docker run -d --rm --name kroki -p 8000:8000 docs-kroki
          for _ in $(seq 60); do
            curl -sf http://localhost:8000/health > /dev/null && break
            sleep 1
          done
          docs-site/check-diagrams.sh http://localhost:8000

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: docs-site/build/site
          retention-days: 7

  deploy:
    needs: build
    # fork からの PR には OIDC の token が出ないので、deploy role を引き受けられない
    if: >-
      vars.PSS_DOCS_ROLE_ARN != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # OIDC で deploy role を引き受けるのに要る
      pull-requests: write  # プレビューの URL を PR にコメントするのに要る
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: site

      - name: Deploy
        id: publish
        uses: ./.github/actions/private-site-deploy
        with:
          source_dir: site
          subdir: ${{ github.event_name == 'pull_request' && env.PREVIEW_SUBDIR || '' }}
          role_to_assume: ${{ env.SITE_ROLE_ARN }}
          bucket: ${{ env.SITE_BUCKET }}
          site_url: ${{ env.SITE_URL }}

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYED_URL: ${{ steps.publish.outputs.url }}
          # ルートの index.html は ja/index.html へ転送するだけなので、?diff は実際のページに付ける
          START_PAGE: ja/index.html
        with:
          script: |
            const marker = '<!-- private-site-preview -->';
            const { owner, repo } = context.repo;
            const page = `${process.env.DEPLOYED_URL}${process.env.START_PAGE}`;
            const body = [marker, `プレビュー: ${page}`, `本番との差分: ${page}?diff`].join('\n');
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.body?.includes(marker));
            if (old) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # bucket には自動で消す設定 (lifecycle rule) が無いので、PR を閉じたらプレビューを消す
  remove-preview:
    if: >-
      vars.PSS_DOCS_ROLE_ARN != '' &&
      github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/private-site-deploy
        with:
          mode: remove
          subdir: ${{ env.PREVIEW_SUBDIR }}
          role_to_assume: ${{ env.SITE_ROLE_ARN }}
          bucket: ${{ env.SITE_BUCKET }}
          site_url: ${{ env.SITE_URL }}
