name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Docker tagging step compares each version against the previous
          # commit, so the parent has to be fetched.
          fetch-depth: 2
      - uses: ./.github/actions/setup-node-pnpm
        with:
          registry-url: 'https://registry.npmjs.org'

      # Kept even though pnpm now drives the publish: OIDC trusted publishing is
      # an npm-CLI capability, and pnpm 10.x has none of its own (pnpm gained it
      # in 11.x). If the first real release fails to authenticate, that version
      # gap is the first thing to check.
      - name: Update npm for OIDC support
        run: npm install -g npm@latest && npm --version

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # One step covers both halves of the release: with changesets pending it
      # opens the version PR, and once that PR is merged it publishes. `pnpm
      # release` is the documented entry point (build + changeset publish), and
      # changesets runs `pnpm publish` in a pnpm workspace -- which is what
      # replaces the `catalog:` and `workspace:` specifiers with real versions.
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # A version bump is what makes a release, for a Docker package as much as
      # for an npm one -- so this tags only what this push actually bumped, and
      # the tag is what docker-release.yml builds from.
      #
      # Reacting to the push itself instead would tag on every merge to main,
      # and on a repository whose tags do not exist yet it would tag everything
      # at once the first time it ran.
      - name: Tag Docker packages whose version changed
        run: |
          for pkg_dir in packages/*/; do
            [ -f "${pkg_dir}Dockerfile" ] || continue
            [ -f "${pkg_dir}package.json" ] || continue

            name=$(basename "$pkg_dir")
            version=$(jq -r .version "${pkg_dir}package.json")
            previous=$(git show "HEAD^:${pkg_dir}package.json" 2>/dev/null | jq -r .version 2>/dev/null || true)

            if [ "$version" = "$previous" ]; then
              echo "$name: unchanged at $version"
              continue
            fi

            tag="${name}-v${version}"
            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "$name: $tag already exists"
              continue
            fi

            echo "$name: ${previous:-none} -> $version, tagging $tag"
            git tag "$tag"
            git push origin "$tag"
          done
