name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Docker tagging step compares each version against the previous
          # commit, so the parent has to be fetched.
          fetch-depth: 2
      # Deliberately no `registry-url`. Passing one makes actions/setup-node
      # write `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into an
      # .npmrc and export NODE_AUTH_TOKEN as its placeholder,
      # `XXXXX-XXXXX-XXXXX-XXXXX`. npm's own OIDC flow overrides a configured
      # credential, so this is invisible on npm -- but pnpm 11 publishes
      # directly instead of shelling out to npm, sends the placeholder as a
      # bearer token, and the registry answers 404. registry.npmjs.org is the
      # default anyway, so nothing needs the setting.
      - uses: ./.github/actions/setup-node-pnpm

      # The point above is a silent failure -- a credential in scope does not
      # announce itself, it just turns into an unexplained 404 at the very end
      # of a release. So assert it rather than rely on the comment.
      - name: Refuse to publish with a static npm credential in scope
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ] && grep -q '_authToken' "$npmrc"; then
            echo "::error::$npmrc sets _authToken. Trusted publishing needs no credential, and pnpm sends this one instead -- npm rejects it as 404."
            exit 1
          fi
          echo "No static npm credential in scope; the publish will authenticate over OIDC."

      # pnpm 11 runs the OIDC exchange itself, so the runner's npm is not in the
      # publish path. Kept as a cheap fallback for any code path that still
      # shells out to npm; the runner ships a version too old to do OIDC.
      - name: Update npm for OIDC support
        run: npm install -g npm@latest && npm --version

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # One step covers both halves of the release: with changesets pending it
      # opens the version PR, and once that PR is merged it publishes. `pnpm
      # release` is the documented entry point (build + changeset publish), and
      # changesets runs `pnpm publish` in a pnpm workspace -- which is what
      # replaces the `catalog:` and `workspace:` specifiers with real versions.
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # A version bump is what makes a release, for a Docker package as much as
      # for an npm one -- so this tags only what this push actually bumped, and
      # the tag is what docker-release.yml builds from.
      #
      # Reacting to the push itself instead would tag on every merge to main,
      # and on a repository whose tags do not exist yet it would tag everything
      # at once the first time it ran.
      - name: Tag Docker packages whose version changed
        run: |
          for pkg_dir in packages/*/; do
            [ -f "${pkg_dir}Dockerfile" ] || continue
            [ -f "${pkg_dir}package.json" ] || continue

            name=$(basename "$pkg_dir")
            version=$(jq -r .version "${pkg_dir}package.json")
            previous=$(git show "HEAD^:${pkg_dir}package.json" 2>/dev/null | jq -r .version 2>/dev/null || true)

            if [ "$version" = "$previous" ]; then
              echo "$name: unchanged at $version"
              continue
            fi

            tag="${name}-v${version}"
            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "$name: $tag already exists"
              continue
            fi

            echo "$name: ${previous:-none} -> $version, tagging $tag"
            git tag "$tag"
            git push origin "$tag"
          done
