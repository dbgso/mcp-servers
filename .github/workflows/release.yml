name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Docker tagging step compares each version against the previous
          # commit, so the parent has to be fetched.
          fetch-depth: 2
      # Deliberately no `registry-url`. Passing one makes actions/setup-node
      # write `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into an
      # .npmrc and export NODE_AUTH_TOKEN as its placeholder,
      # `XXXXX-XXXXX-XXXXX-XXXXX`. npm's own OIDC flow overrides a configured
      # credential, so this is invisible on npm -- but pnpm 11 publishes
      # directly instead of shelling out to npm, sends the placeholder as a
      # bearer token, and the registry answers 404. registry.npmjs.org is the
      # default anyway, so nothing needs the setting.
      - uses: ./.github/actions/setup-node-pnpm

      # The point above is a silent failure -- a credential in scope does not
      # announce itself, it just turns into an unexplained 404 at the very end
      # of a release. So assert it rather than rely on the comment.
      - name: Refuse to publish with a static npm credential in scope
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ] && grep -q '_authToken' "$npmrc"; then
            echo "::error::$npmrc sets _authToken. Trusted publishing needs no credential, and pnpm sends this one instead -- npm rejects it as 404."
            exit 1
          fi
          echo "No static npm credential in scope; the publish will authenticate over OIDC."

      # pnpm 11 runs the OIDC exchange itself, so the runner's npm is not in the
      # publish path. Kept as a cheap fallback for any code path that still
      # shells out to npm; the runner ships a version too old to do OIDC.
      - name: Update npm for OIDC support
        run: npm install -g npm@latest && npm --version

      # A rejected publish comes back as `E404 undefined`, which reads as "no
      # such package" but means "this identity may not write here" -- npm hides
      # which. Worse, pnpm treats a failed exchange as a warning and publishes
      # unauthenticated anyway, so the misconfiguration only ever surfaces as
      # that same 404 at the very end of a release.
      #
      # This is the exact call pnpm makes, run early and reported plainly, so
      # the trusted-publisher setup is distinguishable from the release itself.
      # It only reports: a release with no publishable packages must not fail
      # over npm configuration, and the publish reports its own failure.
      - name: Check whether npm accepts our OIDC identity
        env:
          REGISTRY: https://registry.npmjs.org
        run: |
          id_token=$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "::add-mask::$id_token"

          # npm matches a trusted publisher against these claims and will not
          # say which one disagreed -- it answers "package not found" either
          # way. Printing them turns "npm refuses us" into a value-by-value
          # comparison against the form on the package's access page. They are
          # signed metadata, not credentials; the token itself stays masked.
          #
          # The ids matter as much as the names here. This repository replaced
          # an earlier one of the same name, so `dbgso/mcp-servers` has meant
          # two different repositories -- and only one of them is the one a
          # configuration written before the rebuild would be pinned to.
          if [ -n "$id_token" ] && [ "$id_token" != "null" ]; then
            echo "The identity npm is being asked to trust:"
            ID_TOKEN="$id_token" node -e '
              const c = JSON.parse(Buffer.from(process.env.ID_TOKEN.split(".")[1], "base64url").toString());
              for (const k of ["repository", "repository_id", "repository_owner", "repository_owner_id", "workflow_ref", "job_workflow_ref", "ref", "environment", "repository_visibility"]) {
                console.log("  " + k + ": " + (c[k] ?? "(absent)"));
              }
            '
          fi

          if [ -z "$id_token" ] || [ "$id_token" = "null" ]; then
            echo "::warning::GitHub issued no OIDC token; the publish cannot authenticate."
            exit 0
          fi

          # The response body carries a live npm token on success, so it is
          # written to a file, read only on failure, and deleted either way.
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT

          for name in $(jq -r 'select(.private != true) | .name' packages/*/package.json); do
            escaped=$(printf '%s' "$name" | sed 's|/|%2f|')
            status=$(curl -sS -o "$body" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $id_token" -H "Content-Length: 0" \
              "${REGISTRY}/-/npm/v1/oidc/token/exchange/package/${escaped}")

            if [ "$status" = "200" ]; then
              echo "$name: npm accepted this workflow as a trusted publisher"
            else
              echo "::warning::$name: npm refused this workflow (HTTP $status) -- $(jq -r '.error // .message // "no detail"' "$body" 2>/dev/null). Check the Trusted Publisher on https://www.npmjs.com/package/$name/access: repository and workflow filename must match this one exactly."
            fi
          done

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # One step covers both halves of the release: with changesets pending it
      # opens the version PR, and once that PR is merged it publishes. `pnpm
      # release` is the documented entry point (build + changeset publish), and
      # changesets runs `pnpm publish` in a pnpm workspace -- which is what
      # replaces the `catalog:` and `workspace:` specifiers with real versions.
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm cannot attest a build it cannot show anyone: provenance is
          # rejected outright for a private source repository, whatever the
          # package's own visibility. Asking for it anyway does not degrade to
          # publishing without it -- the publish fails, and by the time the
          # error has passed through changesets it no longer mentions
          # provenance at all.
          #
          # So it follows the repository rather than being asserted: off while
          # private, on the moment it goes public, with no release-day edit.
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}

      # A version bump is what makes a release, for a Docker package as much as
      # for an npm one -- so this tags only what this push actually bumped, and
      # the tag is what docker-release.yml builds from.
      #
      # Reacting to the push itself instead would tag on every merge to main,
      # and on a repository whose tags do not exist yet it would tag everything
      # at once the first time it ran.
      - name: Tag Docker packages whose version changed
        run: |
          for pkg_dir in packages/*/; do
            [ -f "${pkg_dir}Dockerfile" ] || continue
            [ -f "${pkg_dir}package.json" ] || continue

            name=$(basename "$pkg_dir")
            version=$(jq -r .version "${pkg_dir}package.json")
            previous=$(git show "HEAD^:${pkg_dir}package.json" 2>/dev/null | jq -r .version 2>/dev/null || true)

            if [ "$version" = "$previous" ]; then
              echo "$name: unchanged at $version"
              continue
            fi

            tag="${name}-v${version}"
            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "$name: $tag already exists"
              continue
            fi

            echo "$name: ${previous:-none} -> $version, tagging $tag"
            git tag "$tag"
            git push origin "$tag"
          done
