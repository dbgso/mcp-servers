version: 2
updates:
  # pnpm workspace (packages/*, scripts) と pnpm-workspace.yaml の catalog をまとめて更新する
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /packages/graph-math-mcp
      - /packages/python-diagrams-mcp
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
